<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1200,initial-scale=1">
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body { position: relative; background: #131412; color: #e9e9e3; font-family: Arial, Helvetica, sans-serif; }
      body::before { content: ""; position: absolute; inset: -180px 410px 230px -120px; background: #de8c4f; opacity: .12; filter: blur(100px); }
      body::after { content: ""; position: absolute; inset: 200px -140px -180px 520px; background: #c8f135; opacity: .12; filter: blur(110px); }
      .topline { position: absolute; inset: 0 0 auto; height: 5px; background: linear-gradient(90deg, #de8c4f 0 50%, #c8f135 50%); }
      main { position: relative; z-index: 1; height: 100%; padding: 58px 72px 54px; display: flex; flex-direction: column; }
      .brand { display: flex; align-items: center; gap: 18px; font-weight: 800; font-size: 30px; letter-spacing: -.02em; }
      .hat { width: 50px; height: 38px; position: relative; flex: none; }
      .hat span { position: absolute; background: #c8f135; }
      .hat .a { left: 17px; top: 0; width: 18px; height: 5px; }
      .hat .b { left: 10px; top: 5px; width: 32px; height: 5px; }
      .hat .c { left: 7px; top: 10px; width: 38px; height: 8px; }
      .hat .d { left: 10px; top: 18px; width: 32px; height: 8px; background: #0b0c0a; }
      .hat .e { left: 0; top: 26px; width: 50px; height: 8px; }
      .hat .f { left: 3px; top: 34px; width: 44px; height: 3px; background: #8fb024; }
      .kicker { margin-top: auto; font: 700 15px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .19em; color: #9a9a92; }
      h1 { max-width: 970px; margin: 24px 0 20px; font-size: 67px; line-height: 1.03; letter-spacing: -.045em; }
      h1 em { color: #c8f135; }
      p { width: 890px; margin: 0 0 36px; color: #b7b6b0; font-size: 24px; line-height: 1.42; }
      .footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #383934; padding-top: 22px; }
      .assurance { color: #de8c4f; font: 700 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; }
      .status { display: flex; align-items: center; gap: 10px; color: #c8f135; font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .14em; }
      .status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #c8f135; box-shadow: 0 0 20px #c8f135; }
    </style>
  </head>
  <body>
    <div class="topline"></div>
    <main>
      <div class="brand">
        <div class="hat" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span><span class="d"></span><span class="e"></span><span class="f"></span></div>
        DERIV.WTF
      </div>
      <div class="kicker">DERIV.WTF · OG HOLDER APPROVAL LAYER</div>
      <h1>Derivatives are approved by <em>OG holders</em>.</h1>
      <p>Derivative mints open one matched original ID and one holder signature at a time.</p>
      <div class="footer">
        <div class="assurance">NO BRIDGE · NO TRANSFER · ORIGINALS STAY HOME.</div>
        <div class="status">PRE-AUDIT DEMONSTRATION</div>
      </div>
    </main>
  </body>
</html>
