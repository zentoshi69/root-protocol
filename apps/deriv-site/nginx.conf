user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;

  log_format concise '$remote_addr - $host "$request" $status $body_bytes_sent '
                     'rt=$request_time ua="$http_user_agent"';
  access_log /dev/stdout concise;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  server_tokens off;
  client_max_body_size 1k;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      try_files /healthz =503;
    }

    location = /version.json {
      access_log off;
      default_type application/json;
      try_files /version.json =503;
    }

    location ~ (^|/)\. {
      return 404;
    }

    location ~* \.(?:env|git|map|log|sql|bak)$ {
      return 404;
    }

    location / {
      try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
      internal;
    }
  }
}
