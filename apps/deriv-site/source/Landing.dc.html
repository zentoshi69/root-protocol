document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ackwards;display:flex;gap:14px;flex-wrap:wrap\">\n      <a href=\"Root Space.dc.html\" style=\"position:relative;overflow:hidden;background:#C8F135;color:#131412;font-family:'Silkscreen',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.1em;padding:15px 22px;display:inline-block;white-space:nowrap\" style-hover=\"background:#DFF97A\">ENTER THE PUPPETS ROOT SPACE&nbsp;&nbsp;→<\u002Fa>\n      <a href=\"Protocol.dc.html\" style=\"border:1px solid rgba(222,140,79,.5);color:#DE8C4F;font-family:'Silkscreen',ui-monospace,monospace;font-size:12px;letter-spacing:.1em;padding:15px 22px;display:inline-block;white-space:nowrap\" style-hover=\"border-color:#DE8C4F;color:#E9A76F\">HOW SETTLEMENT WORKS<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-rise=\"6\" style=\"animation:rise .7s cubic-bezier(.16,.8,.24,1) .2s backwards;position:relative\">\n    <div style=\"position:relative;background:#191A17;border:1px solid rgba(233,233,227,.16);box-shadow:-10px 10px 0 rgba(222,140,79,.14),10px 10px 0 rgba(200,241,53,.14);padding:22px 24px 20px\">\n      <div style=\"display:flex;align-items:center;gap:10px;font-family:'Silkscreen',ui-monospace,monospace;font-size:10.5px;letter-spacing:.16em;color:rgba(233,233,227,.62)\">\n        <span style=\"width:7px;height:7px;border-radius:50%;background:#C8F135;animation:pulseDot 1.6s ease-in-out infinite\"><\u002Fspan>\n        LIVE — OG APPROVALS, ONE SIGNATURE AT A TIME\n        <span style=\"margin-left:auto;color:#C8F135;white-space:nowrap\">DAY {{ simDay }} / 21<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end;margin:18px 0 10px;font-family:'Silkscreen',ui-monospace,monospace;font-size:11px;letter-spacing:.1em\">\n        <div style=\"color:#DE8C4F\">BITCOIN — 10,001 PUPPETS<div style=\"font-size:9.5px;color:rgba(222,140,79,.6);margin-top:3px\">THE ORIGINALS. THEY NEVER MOVE.<\u002Fdiv><\u002Fdiv>\n        <div style=\"color:rgba(233,233,227,.4);font-size:9.5px;text-align:center;padding-bottom:2px\">SIGNATURE<br>BYTES ONLY →<\u002Fdiv>\n        <div style=\"color:#C8F135;text-align:right\">ROBINHOOD — HOODPUPS <span style=\"color:#DFF97A\">{{ actFmt }}<\u002Fspan><div style=\"font-size:9.5px;color:rgba(200,241,53,.6);margin-top:3px\">DERIVATIVES APPROVED BY THEIR OG<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <canvas ref=\"{{ mapRef }}\" style=\"width:100%;display:block;margin:0 0 14px;image-rendering:pixelated\"><\u002Fcanvas>\n      <div style=\"display:flex;gap:16px;font-family:'Silkscreen',ui-monospace,monospace;font-size:10px;letter-spacing:.08em;color:rgba(233,233,227,.48);flex-wrap:wrap\">\n        <span style=\"display:inline-flex;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;background:rgba(222,140,79,.22);display:inline-block\"><\u002Fspan>OG — NOT SIGNED<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;background:#E5C15A;display:inline-block\"><\u002Fspan>CONSIDERING AN OFFER<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;background:#DE8C4F;display:inline-block\"><\u002Fspan>CONSENT SIGNED<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;background:rgba(233,233,227,.07);display:inline-block\"><\u002Fspan>SLOT AWAITING CONSENT<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:6px\"><span style=\"width:8px;height:8px;background:#C8F135;display:inline-block\"><\u002Fspan>HOODPUP APPROVED<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(233,233,227,.1);margin-top:16px;border:1px solid rgba(233,233,227,.1)\">\n        <div style=\"background:#191A17;padding:12px 14px\"><div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:24px;font-weight:600;color:#C8F135;font-variant-numeric:tabular-nums\">{{ actFmt }}<\u002Fdiv><div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;color:rgba(233,233,227,.48);margin-top:3px\">OG APPROVALS · LIVE<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#191A17;padding:12px 14px\"><div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:24px;font-weight:600;color:#E9E9E3;font-variant-numeric:tabular-nums\">{{ holdFmt }}<\u002Fdiv><div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;color:rgba(233,233,227,.48);margin-top:3px\">UNIQUE OG HOLDERS<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#191A17;padding:12px 14px\"><div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:24px;font-weight:600;color:#E9E9E3;font-variant-numeric:tabular-nums\">{{ yesFmt }}%<\u002Fdiv><div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;color:rgba(233,233,227,.48);margin-top:3px\">ROOT VOTE · YES<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;font-family:'Silkscreen',ui-monospace,monospace;font-size:10.5px;letter-spacing:.06em;color:rgba(233,233,227,.48)\">Supply is revealed by participation. <a href=\"Root Space.dc.html\">Watch it live →<\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"border-top:1px solid rgba(233,233,227,.08);border-bottom:1px solid rgba(233,233,227,.08);background:#111210\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:13px 32px;display:flex;flex-wrap:wrap;row-gap:6px;column-gap:34px;font-family:'Silkscreen',ui-monospace,monospace;font-size:10.5px;letter-spacing:.1em;color:rgba(233,233,227,.48)\">\n    <span>ROOT VOTE <span style=\"color:#C8F135\">78.8% YES<\u002Fspan><\u002Fspan><span>·<\u002Fspan>\n    <span>TURNOUT 26.0% OF SUPPLY<\u002Fspan><span>·<\u002Fspan>\n    <span>ACTIVATION CLOSES <span style=\"color:#E9E9E3\">8D 14H<\u002Fspan><\u002Fspan><span>·<\u002Fspan>\n    <span>CHAIN <span style=\"color:#E9E9E3\">ROBINHOOD #4663<\u002Fspan><\u002Fspan><span>·<\u002Fspan>\n    <span>QUORUM <span style=\"color:#E9E9E3\">3 OF 5 VERIFIERS<\u002Fspan><\u002Fspan><span>·<\u002Fspan>\n    <span style=\"color:#DE8C4F\">NO MAINNET · PRE-AUDIT<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<section data-screen-label=\"Dual consent\" style=\"max-width:1280px;margin:0 auto;padding:96px 32px 40px\">\n  <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:11px;letter-spacing:.22em;color:#C8F135;margin-bottom:14px\">01 · DUAL CONSENT<\u002Fdiv>\n  <h2 style=\"margin:0 0 14px;font-size:clamp(30px,3vw,42px);line-height:1.08;letter-spacing:-.018em;font-weight:600;text-wrap:balance;max-width:22ch\">The community approves the branch. Each root decides whether it sprouts.<\u002Fh2>\n  <p style=\"margin:0 0 40px;font-size:17px;line-height:1.6;color:rgba(233,233,227,.62);max-width:62ch;text-wrap:pretty\">A collection-wide vote can approve the road. It can never force a single Puppet onto it. Two separate approvals, and neither substitutes for the other.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px\">\n    <div style=\"border:1px solid rgba(233,233,227,.13);background:#191A17;box-shadow:6px 6px 0 rgba(222,140,79,.12);padding:26px 28px\">\n      <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:10px;letter-spacing:.18em;color:rgba(233,233,227,.48);margin-bottom:10px\">LAYER 1 — ROOT VOTE<\u002Fdiv>\n      <div style=\"font-size:22px;font-weight:600;letter-spacing:-.01em;margin-bottom:10px\">The Assembly approves the idea<\u002Fdiv>\n      <p style=\"margin:0 0 18px;font-size:14.5px;line-height:1.6;color:rgba(233,233,227,.62)\">Verified original holders vote on the whole proposal — art, chain, price, split, license hash, windows. Two measures, both must pass, so one whale holding 2,000 Puppets can never be \"the community.\"<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(233,233,227,.1);border:1px solid rgba(233,233,227,.1)\">\n        <div style=\"background:#171815;padding:11px 13px\"><div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:17px;font-weight:600;color:#E9E9E3\">≥ 66%<\u002Fdiv><div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;color:rgba(233,233,227,.48);margin-top:2px\">TOKEN VOTE · YES<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#171815;padding:11px 13px\"><div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:17px;font-weight:600;color:#E9E9E3\">≥ 60%<\u002Fdiv><div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;color:rgba(233,233,227,.48);margin-top:2px\">UNIQUE-HOLDER VOTE<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#171815;padding:11px 13px\"><div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:17px;font-weight:600;color:#E9E9E3\">≥ 10%<\u002Fdiv><div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;color:rgba(233,233,227,.48);margin-top:2px\">MINIMUM TURNOUT<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#171815;padding:11px 13px\"><div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:17px;font-weight:600;color:#E9E9E3\">≥ 100<\u002Fdiv><div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;color:rgba(233,233,227,.48);margin-top:2px\">UNIQUE HOLDERS<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;font-family:'Silkscreen',ui-monospace,monospace;font-size:10.5px;letter-spacing:.06em;color:rgba(233,233,227,.48)\">Defaults — each Root Assembly can amend them in its charter.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid rgba(200,241,53,.22);background:#191A17;box-shadow:6px 6px 0 rgba(200,241,53,.12);padding:26px 28px\">\n      <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:10px;letter-spacing:.18em;color:#C8F135;margin-bottom:10px\">LAYER 2 — ROOT CONSENT<\u002Fdiv>\n      <div style=\"font-size:22px;font-weight:600;letter-spacing:-.01em;margin-bottom:10px\">Every holder signs for their own IDs<\u002Fdiv>\n      <p style=\"margin:0 0 18px;font-size:14.5px;line-height:1.6;color:rgba(233,233,227,.62)\">After the vote passes, an activation window opens. HoodPup #123 can exist only because the holder of Bitcoin Puppet #123 signed for it — one BIP-322 message, from the wallet that controls the inscription. #6969's holder stays silent, so #6969 can never exist.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px\">\n        <span style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:10px;letter-spacing:.1em;border:1px solid rgba(233,233,227,.2);padding:6px 10px;color:rgba(233,233,227,.85)\">KEEP IT<\u002Fspan>\n        <span style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:10px;letter-spacing:.1em;border:1px solid rgba(233,233,227,.2);padding:6px 10px;color:rgba(233,233,227,.85)\">SELL AT FIXED PRICE<\u002Fspan>\n        <span style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:10px;letter-spacing:.1em;border:1px solid rgba(200,241,53,.4);padding:6px 10px;color:#C8F135\">ACCEPT BIDS<\u002Fspan>\n        <span style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:10px;letter-spacing:.1em;border:1px solid rgba(233,233,227,.2);padding:6px 10px;color:rgba(233,233,227,.85)\">PUBLIC MINT POOL<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:rgba(233,233,227,.62)\">Signing never spends, transfers, or encumbers the inscription. <span style=\"color:#DE8C4F\">The protocol holds no Bitcoin key<\u002Fspan> — and we will never ask for a seed phrase.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Consent-bound supply\" style=\"max-width:1280px;margin:0 auto;padding:96px 32px 40px\">\n  <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:11px;letter-spacing:.22em;color:#C8F135;margin-bottom:14px\">02 · CONSENT-BOUND SUPPLY<\u002Fdiv>\n  <h2 style=\"margin:0 0 14px;font-size:clamp(30px,3vw,42px);line-height:1.08;letter-spacing:-.018em;font-weight:600;max-width:24ch;text-wrap:balance\">Three numbers, and only the last one is the collection.<\u002Fh2>\n  <p style=\"margin:0 0 44px;font-size:17px;line-height:1.6;color:rgba(233,233,227,.62);max-width:62ch;text-wrap:pretty\">Scarcity is the intersection of OG holder consent and real buyer demand. No consent, no token. No buyer, no token. The HoodPups launch, worked end to end:<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:0;align-items:stretch\">\n    <div style=\"border:1px solid rgba(233,233,227,.13);background:#191A17;padding:28px 30px\">\n      <div style=\"font-size:56px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;color:rgba(233,233,227,.62)\">10,001<\u002Fdiv>\n      <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;color:rgba(233,233,227,.48);margin:12px 0 8px\">POTENTIAL SUPPLY<\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:rgba(233,233,227,.62)\">The size of the Root Collection. A hard ceiling — never a promise.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;padding:0 14px;font-family:'Silkscreen',ui-monospace,monospace;font-size:18px;color:rgba(233,233,227,.3)\">≥<\u002Fdiv>\n    <div style=\"border:1px solid rgba(200,241,53,.3);background:#191A17;padding:28px 30px\">\n      <div style=\"font-size:56px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;color:#C8F135\">1,487<\u002Fdiv>\n      <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;color:rgba(233,233,227,.48);margin:12px 0 8px\">ACTIVATED SUPPLY<\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:rgba(233,233,227,.62)\">IDs whose holders signed inside the 21-day window. Frozen at close as a Merkle root — no late joiners, ever.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;padding:0 14px;font-family:'Silkscreen',ui-monospace,monospace;font-size:18px;color:rgba(233,233,227,.3)\">≥<\u002Fdiv>\n    <div style=\"border:1px solid rgba(233,233,227,.13);background:#191A17;padding:28px 30px\">\n      <div style=\"font-size:56px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;color:#E9E9E3\">1,204<\u002Fdiv>\n      <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;color:rgba(233,233,227,.48);margin:12px 0 8px\">FINAL MINTED SUPPLY<\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:rgba(233,233,227,.62)\">Claimed or purchased before the 14-day mint closed. 283 activated IDs found no buyer — gone for this launch.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:18px;display:flex;gap:28px;flex-wrap:wrap;font-family:'Silkscreen',ui-monospace,monospace;font-size:11.5px;letter-spacing:.1em;color:rgba(233,233,227,.48)\">\n    <span>FINAL&nbsp;≤&nbsp;ACTIVATED&nbsp;≤&nbsp;ORIGINAL<\u002Fspan>\n    <span style=\"color:rgba(233,233,227,.62)\">One verified HoodPup may be minted per protocol Root.<\u002Fspan>\n    <span>MISSING NUMBERS STAY MISSING — #2 NEVER EXISTED<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"The machine\" style=\"max-width:1280px;margin:0 auto;padding:96px 32px 40px\">\n  <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:11px;letter-spacing:.22em;color:#C8F135;margin-bottom:14px\">03 · THE MACHINE<\u002Fdiv>\n  <h2 style=\"margin:0 0 14px;font-size:clamp(30px,3vw,42px);line-height:1.08;letter-spacing:-.018em;font-weight:600;max-width:24ch;text-wrap:balance\">The only thing that crosses the boundary is a signature.<\u002Fh2>\n  <p style=\"margin:0 0 36px;font-size:17px;line-height:1.6;color:rgba(233,233,227,.62);max-width:64ch;text-wrap:pretty\">A Robinhood Chain contract cannot read Bitcoin, so the protocol doesn't pretend it can. Five independent operators each check Bitcoin against their <em>own<\u002Fem> node and ord index. A 3-of-5 verifier quorum confirms ownership and BTC payments. The Puppet itself never moves.<\u002Fp>\n  <div style=\"border:1px solid rgba(233,233,227,.13);background:#171815;padding:18px 20px;overflow-x:auto\">\n    <svg sc-camel-view-box=\"0 0 1120 340\" role=\"img\" aria-label=\"Three stages: on Bitcoin a Puppet stays in its UTXO while the holder signs; signature bytes cross to five independent verifiers of which three must agree; the attestation settles on Robinhood Chain where one atomic transaction mints and routes the split.\" style=\"display:block;min-width:920px;width:100%;height:auto\">\n      <rect x=\"14\" y=\"34\" width=\"286\" height=\"288\" fill=\"rgba(222,140,79,.055)\" stroke=\"rgba(222,140,79,.34)\"><\u002Frect>\n      <text x=\"30\" y=\"22\" font-family=\"Silkscreen,monospace\" font-size=\"11\" letter-spacing=\"3\" fill=\"#DE8C4F\">BITCOIN<\u002Ftext>\n      <rect x=\"38\" y=\"62\" width=\"238\" height=\"86\" fill=\"#1B1C19\" stroke=\"rgba(222,140,79,.4)\"><\u002Frect>\n      <text x=\"157\" y=\"94\" text-anchor=\"middle\" font-family=\"Archivo,system-ui,sans-serif\" font-size=\"15\" font-weight=\"600\" fill=\"#E9E9E3\">Bitcoin Puppet #123<\u002Ftext>\n      <text x=\"157\" y=\"114\" text-anchor=\"middle\" font-family=\"Silkscreen,monospace\" font-size=\"10.5\" fill=\"rgba(233,233,227,.48)\">inscription abc…def i0 · unspent UTXO<\u002Ftext>\n      <text x=\"157\" y=\"134\" text-anchor=\"middle\" font-family=\"Silkscreen,monospace\" font-size=\"10.5\" fill=\"#DE8C4F\">stays exactly here — always<\u002Ftext>\n      <rect x=\"38\" y=\"196\" width=\"238\" height=\"82\" fill=\"#1B1C19\" stroke=\"rgba(222,140,79,.4)\"><\u002Frect>\n      <text x=\"157\" y=\"228\" text-anchor=\"middle\" font-family=\"Archivo,system-ui,sans-serif\" font-size=\"15\" font-weight=\"600\" fill=\"#E9E9E3\">Holder's cold wallet<\u002Ftext>\n      <text x=\"157\" y=\"248\" text-anchor=\"middle\" font-family=\"Silkscreen,monospace\" font-size=\"10.5\" fill=\"rgba(233,233,227,.48)\">signs BIP-322 · never spends<\u002Ftext>\n      <line x1=\"318\" y1=\"22\" x2=\"318\" y2=\"330\" stroke=\"rgba(233,233,227,.3)\" stroke-dasharray=\"5 6\"><\u002Fline>\n      <line x1=\"276\" y1=\"237\" x2=\"366\" y2=\"237\" stroke=\"#DE8C4F\" stroke-width=\"2\" stroke-dasharray=\"6 6\" style=\"animation:dashflow 1.6s linear infinite\"><\u002Fline>\n      <path d=\"M 366 237 l -9 -5 v 10 z\" fill=\"#DE8C4F\"><\u002Fpath>\n      <text x=\"320\" y=\"226\" text-anchor=\"middle\" font-family=\"Silkscreen,monospace\" font-size=\"10.5\" font-weight=\"600\" fill=\"#DE8C4F\">signature bytes only<\u002Ftext>\n      <text x=\"374\" y=\"22\" font-family=\"Silkscreen,monospace\" font-size=\"11\" letter-spacing=\"3\" fill=\"rgba(233,233,227,.48)\">VERIFIER NETWORK<\u002Ftext>\n      <rect x=\"374\" y=\"44\" width=\"256\" height=\"28\" fill=\"#1B1C19\" stroke=\"rgba(233,233,227,.13)\"><\u002Frect>\n      <text x=\"388\" y=\"62\" font-family=\"Silkscreen,monospace\" font-size=\"10.5\" fill=\"rgba(233,233,227,.62)\">operator 1 · own bitcoind + ord<\u002Ftext>\n      <rect x=\"374\" y=\"80\" width=\"256\" height=\"28\" fill=\"#1B1C19\" stroke=\"rgba(233,233,227,.13)\"><\u002Frect>\n      <text x=\"388\" y=\"98\" font-family=\"Silkscreen,monospace\" font-size=\"10.5\" fill=\"rgba(233,233,227,.62)\">operator 2 · own bitcoind + ord<\u002Ftext>\n      <rect x=\"374\" y=\"116\" width=\"256\" height=\"28\" fill=\"#1B1C19\" stroke=\"rgba(233,233,227,.13)\"><\u002Frect>\n      <text x=\"388\" y=\"134\" font-family=\"Silkscreen,monospace\" font-size=\"10.5\" fill=\"rgba(233,233,227,.62)\">operator 3 · own bitcoind + ord<\u002Ftext>\n      <rect x=\"374\" y=\"152\" width=\"256\" height=\"28\" fill=\"#1B1C19\" stroke=\"rgba(233,233,227,.13)\"><\u002Frect>\n      <text x=\"388\" y=\"170\" font-family=\"Silkscreen,monospace\" font-size=\"10.5\" fill=\"rgba(233,233,227,.62)\">operator 4 · own bitcoind + ord<\u002Ftext>\n      <rect x=\"374\" y=\"188\" width=\"256\" height=\"28\" fill=\"#1B1C19\" stroke=\"rgba(233,233,227,.13)\"><\u002Frect>\n      <text x=\"388\" y=\"206\" font-family=\"Silkscreen,monospace\" font-size=\"10.5\" fill=\"rgba(233,233,227,.62)\">operator 5 · own bitcoind + ord<\u002Ftext>\n      <polyline points=\"630,58 654,58 654,150\" fill=\"none\" stroke=\"rgba(233,233,227,.4)\"><\u002Fpolyline>\n      <polyline points=\"630,94 654,94\" fill=\"none\" stroke=\"rgba(233,233,227,.4)\"><\u002Fpolyline>\n      <polyline points=\"630,130 654,130\" fill=\"none\" stroke=\"rgba(233,233,227,.4)\"><\u002Fpolyline>\n      <polyline points=\"630,166 654,166 654,150\" fill=\"none\" stroke=\"rgba(233,233,227,.4)\"><\u002Fpolyline>\n      <polyline points=\"630,202 654,202 654,150\" fill=\"none\" stroke=\"rgba(233,233,227,.4)\"><\u002Fpolyline>\n      <rect x=\"374\" y=\"250\" width=\"256\" height=\"60\" fill=\"#1B1C19\" stroke=\"rgba(233,233,227,.3)\"><\u002Frect>\n      <text x=\"502\" y=\"276\" text-anchor=\"middle\" font-family=\"Archivo,system-ui,sans-serif\" font-size=\"15\" font-weight=\"600\" fill=\"#E9E9E3\">3 of 5 must agree<\u002Ftext>\n      <text x=\"502\" y=\"296\" text-anchor=\"middle\" font-family=\"Silkscreen,monospace\" font-size=\"10.5\" fill=\"rgba(233,233,227,.48)\">one EIP-712 attestation<\u002Ftext>\n      <polyline points=\"654,150 654,280 634,280\" fill=\"none\" stroke=\"rgba(233,233,227,.4)\"><\u002Fpolyline>\n      <rect x=\"712\" y=\"34\" width=\"394\" height=\"288\" fill=\"rgba(200,241,53,.045)\" stroke=\"rgba(200,241,53,.3)\"><\u002Frect>\n      <text x=\"728\" y=\"22\" font-family=\"Silkscreen,monospace\" font-size=\"11\" letter-spacing=\"3\" fill=\"#C8F135\">ROBINHOOD CHAIN<\u002Ftext>\n      <polyline points=\"630,280 692,280 692,92 732,92\" fill=\"none\" stroke=\"#C8F135\" stroke-width=\"2\" stroke-dasharray=\"6 6\" style=\"animation:dashflow 1.6s linear infinite\"><\u002Fpolyline>\n      <path d=\"M 732 92 l -9 -5 v 10 z\" fill=\"#C8F135\"><\u002Fpath>\n      <text x=\"668\" y=\"310\" text-anchor=\"middle\" font-family=\"Silkscreen,monospace\" font-size=\"10.5\" font-weight=\"600\" fill=\"#C8F135\">relayer<\u002Ftext>\n      <text x=\"668\" y=\"324\" text-anchor=\"middle\" font-family=\"Silkscreen,monospace\" font-size=\"10\" fill=\"rgba(233,233,227,.48)\">pays the gas<\u002Ftext>\n      <rect x=\"736\" y=\"62\" width=\"344\" height=\"58\" fill=\"#1B1C19\" stroke=\"rgba(200,241,53,.35)\"><\u002Frect>\n      <text x=\"908\" y=\"87\" text-anchor=\"middle\" font-family=\"Archivo,system-ui,sans-serif\" font-size=\"15\" font-weight=\"600\" fill=\"#E9E9E3\">BitcoinOwnershipOracle<\u002Ftext>\n      <text x=\"908\" y=\"106\" text-anchor=\"middle\" font-family=\"Silkscreen,monospace\" font-size=\"10.5\" fill=\"rgba(233,233,227,.48)\">consumes the digest once, forever<\u002Ftext>\n      <line x1=\"908\" y1=\"120\" x2=\"908\" y2=\"146\" stroke=\"rgba(233,233,227,.4)\"><\u002Fline>\n      <path d=\"M 908 146 l -5 -9 h 10 z\" fill=\"rgba(233,233,227,.4)\"><\u002Fpath>\n      <rect x=\"736\" y=\"148\" width=\"344\" height=\"58\" fill=\"#1B1C19\" stroke=\"rgba(200,241,53,.35)\"><\u002Frect>\n      <text x=\"908\" y=\"173\" text-anchor=\"middle\" font-family=\"Archivo,system-ui,sans-serif\" font-size=\"15\" font-weight=\"600\" fill=\"#E9E9E3\">RootMintRouter · escrow<\u002Ftext>\n      <text x=\"908\" y=\"192\" text-anchor=\"middle\" font-family=\"Silkscreen,monospace\" font-size=\"10.5\" fill=\"rgba(233,233,227,.48)\">holds the buyer's ETH<\u002Ftext>\n      <line x1=\"908\" y1=\"206\" x2=\"908\" y2=\"232\" stroke=\"rgba(233,233,227,.4)\"><\u002Fline>\n      <path d=\"M 908 232 l -5 -9 h 10 z\" fill=\"rgba(233,233,227,.4)\"><\u002Fpath>\n      <rect x=\"736\" y=\"234\" width=\"344\" height=\"72\" fill=\"#1B1C19\" stroke=\"rgba(200,241,53,.35)\"><\u002Frect>\n      <text x=\"908\" y=\"260\" text-anchor=\"middle\" font-family=\"Archivo,system-ui,sans-serif\" font-size=\"15\" font-weight=\"600\" fill=\"#E9E9E3\">one atomic transaction<\u002Ftext>\n      <text x=\"908\" y=\"280\" text-anchor=\"middle\" font-family=\"Silkscreen,monospace\" font-size=\"10.5\" fill=\"rgba(233,233,227,.48)\">mint HoodPup · route 50 / 20 / 20 / 10<\u002Ftext>\n      <text x=\"908\" y=\"296\" text-anchor=\"middle\" font-family=\"Silkscreen,monospace\" font-size=\"10.5\" fill=\"rgba(233,233,227,.48)\">record the ownership epoch<\u002Ftext>\n    <\u002Fsvg>\n  <\u002Fdiv>\n  <p style=\"margin:22px 0 0;font-size:15px;line-height:1.6;color:rgba(233,233,227,.62);max-width:70ch;text-wrap:pretty\">This is an attested settlement system. Your Puppet is not converted into a token on another chain, and nobody holds it on your behalf. It stays exactly where it is, under your key.<\u002Fp>\n<\u002Fsection>\n\n<section data-screen-label=\"Where the money goes\" style=\"max-width:1280px;margin:0 auto;padding:96px 32px 40px\">\n  <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:11px;letter-spacing:.22em;color:#C8F135;margin-bottom:14px\">04 · WHERE THE MONEY GOES<\u002Fdiv>\n  <h2 style=\"margin:0 0 14px;font-size:clamp(30px,3vw,42px);line-height:1.08;letter-spacing:-.018em;font-weight:600;max-width:24ch;text-wrap:balance\">The split is voted once, then frozen into bytecode.<\u002Fh2>\n  <p style=\"margin:0 0 40px;font-size:17px;line-height:1.6;color:rgba(233,233,227,.62);max-width:64ch;text-wrap:pretty\">Each proposal suggests its own split and the Root Vote approves it. The factory enforces hard floors either way — DERIV.WTF cannot quietly mutate into a fee octopus wearing a decentralization badge.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start\">\n    <div style=\"border:1px solid rgba(233,233,227,.13);background:#191A17;padding:26px 28px\">\n      <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;color:rgba(233,233,227,.48);margin-bottom:20px\">HOODPUPS LAUNCH SPLIT — EVERY PAID MINT, FROM GROSS ESCROW<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;white-space:nowrap;font-family:'Silkscreen',ui-monospace,monospace;font-size:10.5px;letter-spacing:.05em;margin-bottom:7px\"><span style=\"color:#E9E9E3\">HOLDER OF THE SPECIFIC OG ID<\u002Fspan><span style=\"color:#C8F135;font-weight:700\">50%<\u002Fspan><\u002Fdiv>\n          <div style=\"height:12px;background:rgba(233,233,227,.08)\"><div style=\"height:100%;width:50%;background:#C8F135;transform-origin:left;animation:barGrow 1.1s cubic-bezier(.16,.8,.24,1) .1s backwards\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;white-space:nowrap;font-family:'Silkscreen',ui-monospace,monospace;font-size:10.5px;letter-spacing:.05em;margin-bottom:7px\"><span style=\"color:#E9E9E3\">ROOT TREASURY — PUPPETS COMMUNITY<\u002Fspan><span style=\"color:rgba(233,233,227,.85);font-weight:700\">20%<\u002Fspan><\u002Fdiv>\n          <div style=\"height:12px;background:rgba(233,233,227,.08)\"><div style=\"height:100%;width:20%;background:rgba(233,233,227,.62);transform-origin:left;animation:barGrow 1.1s cubic-bezier(.16,.8,.24,1) .25s backwards\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;white-space:nowrap;font-family:'Silkscreen',ui-monospace,monospace;font-size:10.5px;letter-spacing:.05em;margin-bottom:7px\"><span style=\"color:#E9E9E3\">BRANCH BUILDER — HOODPUPS TEAM<\u002Fspan><span style=\"color:rgba(233,233,227,.85);font-weight:700\">20%<\u002Fspan><\u002Fdiv>\n          <div style=\"height:12px;background:rgba(233,233,227,.08)\"><div style=\"height:100%;width:20%;background:rgba(233,233,227,.34);transform-origin:left;animation:barGrow 1.1s cubic-bezier(.16,.8,.24,1) .4s backwards\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;white-space:nowrap;font-family:'Silkscreen',ui-monospace,monospace;font-size:10.5px;letter-spacing:.05em;margin-bottom:7px\"><span style=\"color:#E9E9E3\">ROOT PROTOCOL<\u002Fspan><span style=\"color:#DE8C4F;font-weight:700\">10%<\u002Fspan><\u002Fdiv>\n          <div style=\"height:12px;background:rgba(233,233,227,.08)\"><div style=\"height:100%;width:10%;background:#DE8C4F;transform-origin:left;animation:barGrow 1.1s cubic-bezier(.16,.8,.24,1) .55s backwards\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:22px;padding-top:18px;border-top:1px solid rgba(233,233,227,.1);font-family:'Silkscreen',ui-monospace,monospace;font-size:11px;line-height:1.9;color:rgba(233,233,227,.48)\">\n        WORKED — HOODPUP #123 SELLS FOR 0.10 ETH<br>\n        <span style=\"color:#C8F135\">0.0500 ETH<\u002Fspan> → holder of Bitcoin Puppet #123 · <span style=\"color:rgba(233,233,227,.85)\">0.0200<\u002Fspan> → Root Treasury · <span style=\"color:rgba(233,233,227,.85)\">0.0200<\u002Fspan> → builders · <span style=\"color:#DE8C4F\">0.0100<\u002Fspan> → protocol\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:18px\">\n      <div style=\"border:1px solid rgba(233,233,227,.13);background:#191A17;padding:22px 24px\">\n        <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;color:rgba(233,233,227,.48);margin-bottom:14px\">FACTORY RULES — ENFORCED BY CONTRACT<\u002Fdiv>\n        <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:12px;line-height:2.1;color:rgba(233,233,227,.85)\">\n          OG holder + Root Treasury&nbsp;&nbsp;<span style=\"color:#C8F135\">≥ 60%<\u002Fspan><br>\n          Root Protocol&nbsp;&nbsp;<span style=\"color:#C8F135\">≤ 10%<\u002Fspan><br>\n          Σ of all shares&nbsp;&nbsp;<span style=\"color:#C8F135\">= 100% exactly<\u002Fspan><br>\n          Rounding remainder&nbsp;&nbsp;<span style=\"color:rgba(233,233,227,.62)\">→ protocol, so conservation is exact<\u002Fspan><br>\n          Percentages after launch&nbsp;&nbsp;<span style=\"color:#DE8C4F\">immutable — no setter exists<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid rgba(233,233,227,.13);background:#191A17;padding:22px 24px\">\n        <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:10px;letter-spacing:.16em;color:rgba(233,233,227,.48);margin-bottom:14px\">HOW THE HOLDER GETS PAID<\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-start;gap:10px;margin-bottom:12px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#C8F135;flex:none;margin-top:5px\"><\u002Fspan><p style=\"margin:0;font-size:14px;line-height:1.55;color:rgba(233,233,227,.85)\">ETH payout is on Robinhood Chain. Credited in the PayoutVault — withdraw normally, or sign a gasless withdrawal.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-start;gap:10px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#DE8C4F;flex:none;margin-top:5px\"><\u002Fspan><p style=\"margin:0;font-size:14px;line-height:1.55;color:rgba(233,233,227,.85)\">BTC payout is native Bitcoin sent by a bonded solver. Exact sats, fixed up front — no price oracle anywhere in the path.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Trust model\" style=\"max-width:1280px;margin:0 auto;padding:96px 32px 40px\">\n  <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:11px;letter-spacing:.22em;color:#C8F135;margin-bottom:14px\">05 · THE HONEST PART<\u002Fdiv>\n  <h2 style=\"margin:0 0 14px;font-size:clamp(30px,3vw,42px);line-height:1.08;letter-spacing:-.018em;font-weight:600;max-width:24ch;text-wrap:balance\">What a dishonest quorum can and cannot do.<\u002Fh2>\n  <p style=\"margin:0 0 36px;font-size:17px;line-height:1.6;color:rgba(233,233,227,.62);max-width:64ch;text-wrap:pretty\">Three colluding operators can lie about Bitcoin. Here is exactly how far that goes — the worst case is a bad mint, never a stolen asset.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px\">\n    <div style=\"border:1px solid rgba(228,144,138,.3);background:rgba(228,144,138,.04);padding:24px 26px\">\n      <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:10px;letter-spacing:.18em;color:#E4908A;margin-bottom:16px\">A DISHONEST 3-OF-5 CAN<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Silkscreen',ui-monospace,monospace;color:#E4908A;font-size:12px;flex:none;margin-top:2px\">✕<\u002Fspan><p style=\"margin:0;font-size:14.5px;line-height:1.55;color:rgba(233,233,227,.85)\"><strong>Assert a false ownership fact.<\u002Fstrong> A HoodPup mints to the wrong recipient; the seller share credits the wrong address.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Silkscreen',ui-monospace,monospace;color:#E4908A;font-size:12px;flex:none;margin-top:2px\">✕<\u002Fspan><p style=\"margin:0;font-size:14.5px;line-height:1.55;color:rgba(233,233,227,.85)\"><strong>Assert a false payment fact.<\u002Fstrong> A solver is reimbursed for a Bitcoin payment it never made.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Silkscreen',ui-monospace,monospace;color:#E4908A;font-size:12px;flex:none;margin-top:2px\">✕<\u002Fspan><p style=\"margin:0;font-size:14.5px;line-height:1.55;color:rgba(233,233,227,.85)\"><strong>Censor.<\u002Fstrong> Refuse to attest anything. Escrow still refunds at expiry — it costs time, not principal.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid rgba(200,241,53,.26);background:rgba(200,241,53,.03);padding:24px 26px\">\n      <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:10px;letter-spacing:.18em;color:#C8F135;margin-bottom:16px\">IT CAN NEVER<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Silkscreen',ui-monospace,monospace;color:#C8F135;font-size:12px;flex:none;margin-top:2px\">✓<\u002Fspan><p style=\"margin:0;font-size:14.5px;line-height:1.55;color:rgba(233,233,227,.85)\"><strong>Move anyone's Bitcoin Puppet.<\u002Fstrong> Structural, not policy — no Bitcoin key, no seed, nothing required to move.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Silkscreen',ui-monospace,monospace;color:#C8F135;font-size:12px;flex:none;margin-top:2px\">✓<\u002Fspan><p style=\"margin:0;font-size:14.5px;line-height:1.55;color:rgba(233,233,227,.85)\"><strong>Take credited balances.<\u002Fstrong> No code path reduces a user's claimable balance. Not for an admin, not for anyone.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:12px\"><span style=\"font-family:'Silkscreen',ui-monospace,monospace;color:#C8F135;font-size:12px;flex:none;margin-top:2px\">✓<\u002Fspan><p style=\"margin:0;font-size:14.5px;line-height:1.55;color:rgba(233,233,227,.85)\"><strong>Mint a second HoodPup for a Root,<\u002Fstrong> change the split, redirect a signed payout, or reuse a Bitcoin payment. Each <span style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:12.5px\">txid:vout<\u002Fspan> is consumed globally, once.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Approval levels\" style=\"max-width:1280px;margin:0 auto;padding:96px 32px 40px\">\n  <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:11px;letter-spacing:.22em;color:#C8F135;margin-bottom:14px\">06 · APPROVAL LEVELS<\u002Fdiv>\n  <h2 style=\"margin:0 0 14px;font-size:clamp(30px,3vw,42px);line-height:1.08;letter-spacing:-.018em;font-weight:600;max-width:26ch;text-wrap:balance\">The badge shows exactly what was approved. Nothing more.<\u002Fh2>\n  <p style=\"margin:0 0 36px;font-size:17px;line-height:1.6;color:rgba(233,233,227,.62);max-width:64ch;text-wrap:pretty\">Community voting does not automatically grant legal IP rights, and DERIV.WTF never pretends it does. Every proposal hashes the exact license terms being signed — the protocol proves who approved what, which IDs they controlled, and when.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px\">\n    <div style=\"border:1px solid rgba(233,233,227,.13);background:#191A17;padding:20px 22px\">\n      <span style=\"display:inline-block;font-family:'Silkscreen',ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;border:1px solid rgba(233,233,227,.3);padding:5px 9px;color:rgba(233,233,227,.85);margin-bottom:14px\">ID HOLDER APPROVED<\u002Fspan>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:rgba(233,233,227,.62)\">Individual holders signed for their specific IDs. No collection-wide vote happened.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid rgba(200,241,53,.3);background:#191A17;padding:20px 22px\">\n      <span style=\"display:inline-block;font-family:'Silkscreen',ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;border:1px solid rgba(200,241,53,.5);padding:5px 9px;color:#C8F135;margin-bottom:14px\">COMMUNITY APPROVED<\u002Fspan>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:rgba(233,233,227,.62)\">A verified Root Vote passed, and individual IDs opted in. HoodPups sits here.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid rgba(233,233,227,.13);background:#191A17;padding:20px 22px\">\n      <span style=\"display:inline-block;font-family:'Silkscreen',ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;border:1px solid rgba(233,233,227,.3);padding:5px 9px;color:rgba(233,233,227,.85);margin-bottom:14px\">CREATOR APPROVED<\u002Fspan>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:rgba(233,233,227,.62)\">The original creator or IP owner also signed the exact license-terms hash.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid rgba(222,140,79,.4);background:rgba(222,140,79,.05);padding:20px 22px\">\n      <span style=\"display:inline-block;font-family:'Silkscreen',ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;border:1px solid rgba(222,140,79,.6);padding:5px 9px;color:#DE8C4F;margin-bottom:14px\">FULLY ROOTED<\u002Fspan>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:rgba(233,233,227,.62)\">Vote passed, holders consented, and the creator/IP authority approved. The highest state.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"First branch\" style=\"max-width:1280px;margin:0 auto;padding:96px 32px 110px\">\n  <div style=\"border:1px solid rgba(233,233,227,.13);background:#191A17;display:grid;grid-template-columns:380px 1fr;gap:0;overflow:hidden\">\n    <div style=\"position:relative;border-right:1px solid rgba(233,233,227,.1)\">\n      <img src=\"aed8fac6-5730-4461-a76a-d263a9ba807e\" alt=\"HoodPup — first branch artwork\" style=\"display:block;width:100%;height:100%;object-fit:cover;min-height:340px\">\n      <span style=\"position:absolute;top:14px;left:14px;font-family:'Silkscreen',ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;background:rgba(19,20,18,.85);border:1px solid rgba(200,241,53,.5);color:#C8F135;padding:5px 9px;backdrop-filter:blur(6px)\">COMMUNITY APP line-block;white-space:nowrap\" style-hover=\"border-color:rgba(233,233,227,.6);color:#E9E9E3\">I HOLD A PUPPET<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<footer style=\"position:relative;z-index:1;border-top:1px solid rgba(233,233,227,.1);background:#111210\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:56px 32px 46px\">\n    <div style=\"display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:40px;margin-bottom:44px\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:16px\"><svg width=\"22\" height=\"15\" sc-camel-view-box=\"0 0 22 15\" shape-rendering=\"crispEdges\" style=\"flex:none;display:inline-block\"><rect x=\"7\" y=\"0\" width=\"8\" height=\"2\" fill=\"#C8F135\"><\u002Frect><rect x=\"4\" y=\"2\" width=\"14\" height=\"2\" fill=\"#C8F135\"><\u002Frect><rect x=\"3\" y=\"4\" width=\"16\" height=\"3\" fill=\"#C8F135\"><\u002Frect><rect x=\"4\" y=\"7\" width=\"14\" height=\"3\" fill=\"#0B0C0A\"><\u002Frect><rect x=\"7\" y=\"8\" width=\"1\" height=\"1\" fill=\"#E9E9E3\"><\u002Frect><rect x=\"9\" y=\"8\" width=\"1\" height=\"1\" fill=\"#E9E9E3\"><\u002Frect><rect x=\"11\" y=\"8\" width=\"1\" height=\"1\" fill=\"#E9E9E3\"><\u002Frect><rect x=\"13\" y=\"8\" width=\"1\" height=\"1\" fill=\"#E9E9E3\"><\u002Frect><rect x=\"0\" y=\"10\" width=\"22\" height=\"3\" fill=\"#C8F135\"><\u002Frect><rect x=\"1\" y=\"13\" width=\"20\" height=\"1\" fill=\"#8FB024\"><\u002Frect><\u002Fsvg><span style=\"font-size:19px;font-weight:600\"><span style=\"color:#55564F;font-weight:700;animation:logoGlow 3.4s ease-in-out infinite\">DERIV.WTF<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.65;color:rgba(233,233,227,.48);max-width:44ch\">Root Protocol lets original communities approve their derivatives instead of merely being copied by them.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-si AND NONE UNTIL AN EXTERNAL AUDIT, AN INDEPENDENTLY REPRODUCED MANIFEST, AND FIVE GENUINELY INDEPENDENT OPERATORS ARE IN PLACE. NATIVE BTC SETTLEMENT IS FEATURE-FLAGGED OFF PENDING OPERATIONAL AND LEGAL REVIEW. \"CANONICAL\" MEANS CANONICAL TO THIS PROTOCOL DEPLOYMENT — NOTHING HERE IS AN ENDORSEMENT BY, OR AFFILIATION WITH, THE BITCOIN PUPPETS PROJECT OR ROBINHOOD. DIGITAL COLLECTIBLES ARE VOLATILE AND MAY LOSE ALL VALUE. NOTHING ON THIS PAGE IS INVESTMENT ADVICE.\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<sc-if value=\"{{ discOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(13,14,12,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:24px\">\n    <div role=\"dialog\" aria-label=\"Risk disclosure\" style=\"width:600px;max-width:100%;max-height:86vh;overflow:auto;background:#1B1C19;border:1px solid rgba(233,233,227,.2);padding:34px 36px;font-family:'Styrene A','Styrene B',Archivo,system-ui,sans-serif\">\n      <div style=\"font-family:'Silkscreen',ui-monospace,monospace;font-size:10px;letter-spacing:.2em;color:#DE8C4F;margin-bottom:14px\">RISK DISCLOSURE — READ ONCE, PROPERLY<\u002Fdiv>\n      <div style=\"font-size:26px;font-weight:600;letter-spacing:-.015em;margin-bottom:18px\">Before you use DERIV.WTF<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:13px;font-size:14.5px;line-height:1.62;color:rgba(233,233,227,.85)\">\n        <p style=\"margin:0\"><strong>This is an attested settlement system, not a custody system.<\u002Fstrong> Five independent operators check Bitcoin themselves; three must agree before anything settles. A dishonest majority could assert a false fact. It can never move, spend or encumber your Puppet — the protocol holds no Bitcoin key.<\u002Fp>\n        <p style=\"margin:0\"><strong>The worst case is a bad mint, not a stolen asset.<\u002Fstrong> Your Bitcoin Puppet never leaves Bitcoin, and no signature this site asks for can spend it.<\u002Fp>\n        <p style=\"margin:0\"><strong>Offers cannot be cancelled early.<\u002Fstrong> A holder may be mid-way through a cold-wallet signing ceremony. Your ETH returns automatically at expiry, or immediately if someone else mints the Root first.<\u002Fp>\n        <p style=\"margin:0\"><strong>Pre-audit software on a test network.<\u002Fstrong> No mainnet deployment exists. Native BTC settlement is feature-flagged off pending operational and legal review.<\u002Fp>\n        <p style=\"margin:0\"><strong>No affiliation.<\u002Fstrong> Nothing here is an endorsement by the Bitcoin Puppets project or Robinhood. We will never ask for your seed phrase or private key — if a page or a person asks, it is not us.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:12px;margin-top:26px\">\n        <button sc-camel-on-click=\"{{ ackDisc }}\" style=\"background:#E9E9E3;color:#131412;border:0;cursor:pointer;font-family:'Silkscreen',ui-monospace,monospace;font-size:11.5px;font-weight:700;letter-spacing:.12em;padding:14px 22px\" style-hover=\"background:#FFFFFF\">I UNDERSTAND — ENTER<\u002Fbutton>\n        <a href=\"Protocol.dc.html\" style=\"border:1px solid rgba(233,233,227,.3);color:rgba(233,233,227,.85);font-family:'Silkscreen',ui-monospace,monospace;font-size:11.5px;letter-spacing:.1em;padding:14px 20px;display:inline-block;white-space:nowrap\" style-hover=\"border-color:rgba(233,233,227,.6)\">READ THE TRUST MODEL<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<div ref=\"{{ rainRef }}\" style=\"position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden\"><\u002Fdiv>\n<img ref=\"{{ hatProbeRef }}\" src=\"1d505b69-12d5-4846-8be8-a582097cb205\" alt=\"\" style=\"position:fixed;left:-9999px;top:-9999px;width:1px;height:1px\">\n\n<sc-if value=\"{{ shineOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:95;display:flex;
