# Bitcoin regtest + ord + Anvil, for end-to-end testing without touching real value.
#
# Nothing here ever reaches mainnet. The RPC credentials below are deliberately trivial and
# deliberately committed: they secure a throwaway regtest chain whose coins are worth nothing, and
# pretending otherwise would encourage someone to reuse a "real-looking" secret somewhere it matters.
#
#   docker compose -f infra/regtest/docker-compose.yml up -d --wait
#   pnpm --filter @hoodpups/regtest-harness run e2e
#   docker compose -f infra/regtest/docker-compose.yml down -v

name: hoodpups-regtest

services:
  bitcoind:
    # Bitcoin Core 24 is end-of-life. This manifest is the multi-platform 31.1 image index; it is
    # an explicitly test-only image containing the release binaries from bitcoincore.org.
    image: bitcoin/bitcoin:31.1@sha256:da25cedc66b1daefff9f412ee196c901a899c3fa68a33b20849c3e08b5c40d63
    container_name: hoodpups-bitcoind
    restart: unless-stopped
    command:
      - -regtest=1
      - -server=1
      - -txindex=1                # ord needs a full transaction index
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=hoodpups
      - -rpcpassword=regtest-only-not-a-secret
      - -fallbackfee=0.0002
      - -maxtxfee=1.0
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
    ports:
      - "127.0.0.1:18443:18443"   # RPC; never expose public regtest credentials to the LAN
      - "127.0.0.1:28332:28332"   # ZMQ raw block
      - "127.0.0.1:28333:28333"   # ZMQ raw tx
    volumes:
      - bitcoin-data:/home/bitcoin/.bitcoin
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -regtest -rpcuser=hoodpups -rpcpassword=regtest-only-not-a-secret getblockchaininfo || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  ord:
    # Upstream does not publish a public 0.27.1 container. Dockerfile.ord verifies the official
    # release asset checksum. The released Linux binary is x86_64-only.
    platform: linux/amd64
    image: hoodpups/ord:0.27.1
    build:
      context: .
      dockerfile: Dockerfile.ord
    container_name: hoodpups-ord
    restart: unless-stopped
    depends_on:
      bitcoind:
        condition: service_healthy
    command:
      - --regtest
      - --bitcoin-rpc-url=http://bitcoind:18443
      - --bitcoin-rpc-username=hoodpups
      - --bitcoin-rpc-password=regtest-only-not-a-secret
      - --index-addresses         # the verifier resolves an output's owning script
      - --index-sats              # satpoint resolution for inscription location
      - --data-dir=/data
      - server
      - --http-port=8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ord-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/status || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 15s

  # Stands in for Robinhood Chain locally. Chain id 31337 is what the deploy script treats as the
  # local-development override; it will refuse any unrecognised chain id without one.
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.5.1@sha256:3a70bfa9bd2c732a767bb60d12c8770b40e8f9b6cca28efc4b12b1be81c7f28e
    container_name: hoodpups-anvil
    restart: unless-stopped
    entrypoint: ["anvil"]
    command:
      - --host=0.0.0.0
      - --port=8545
      - --chain-id=31337
      - --block-time=1
      - --accounts=15             # deployer, buyer, recipient, seller, solver, 5 attestors, spares
      - --balance=10000
      - --mnemonic=test test test test test test test test test test test junk
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://127.0.0.1:8545 || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  bitcoin-data:
  ord-data:
