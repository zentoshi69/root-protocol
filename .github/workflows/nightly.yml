name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-fuzz:
    name: Deep stateful invariants
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1
      - name: 2000-run invariant campaign
        working-directory: contracts
        run: FOUNDRY_PROFILE=deep forge test -vv

  regtest-e2e:
    name: Bitcoin regtest end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Require the real regtest harness
        run: |
          test -f infra/regtest/package.json || {
            echo "::error::infra/regtest is currently a specification only; implement @hoodpups/regtest-harness before public launch"
            exit 1
          }
          grep -q '"name"[[:space:]]*:[[:space:]]*"@hoodpups/regtest-harness"' infra/regtest/package.json

      - name: Start bitcoind + ord
        run: docker compose -f infra/regtest/docker-compose.yml up -d --wait

      - name: Full flow — inscribe, offer, prove, attest, settle, move, rebind
        run: pnpm --filter @hoodpups/regtest-harness run e2e

      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/regtest/docker-compose.yml logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f infra/regtest/docker-compose.yml down -v
