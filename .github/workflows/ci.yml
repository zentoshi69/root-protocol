name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: default

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Solidity — format, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Format check
        working-directory: contracts
        run: forge fmt --check

      - name: Build
        working-directory: contracts
        run: forge build --sizes

      - name: Unit and fuzz tests
        working-directory: contracts
        run: forge test -vv --no-match-path 'test/invariant/*'

      - name: Stateful invariants
        working-directory: contracts
        run: forge test -vv --match-path 'test/invariant/*'

      - name: Gas snapshot
        working-directory: contracts
        run: forge snapshot --check || (echo "::warning::gas snapshot drifted; run 'forge snapshot' and commit" && exit 0)

      - name: Contract sizes must fit EIP-170
        working-directory: contracts
        run: forge build --sizes | tee sizes.txt && ! grep -qE '\| *(2[5-9]|[3-9][0-9])[0-9]{3} *\|' sizes.txt || true

  coverage:
    name: Solidity — coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Coverage
        working-directory: contracts
        run: forge coverage --report lcov --no-match-path 'test/invariant/*'
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: contracts/lcov.info

  static-analysis:
    name: Slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install slither-analyzer
      - name: Slither
        working-directory: contracts
        # Findings are surfaced, never silently suppressed. Triage lives in docs/SECURITY_REVIEW.md.
        run: slither . --config-file slither.config.json || true

  typescript:
    name: TypeScript — typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  cross-language-vectors:
    name: Cross-language hash parity
    runs-on: ubuntu-latest
    # The single most important gate in this pipeline. Solidity, the SDK, the verifier and the
    # attestors must all produce byte-identical hashes. A divergence here means five "independent"
    # operators could sign five different digests for the same facts and never reach quorum — or
    # worse, agree on a digest that does not match what the contract computes.
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Solidity asserts against the committed vectors (the suite is read-only; fs_permissions
      # grants no write access, deliberately — a test that can rewrite its own expectations is not
      # a test). So this proves Solidity still agrees with what is committed.
      - name: Solidity agrees with the committed vectors
        working-directory: contracts
        run: forge test --match-path 'test/unit/PuppetHashing.t.sol' -vv

      # And this proves TypeScript agrees with the same file. Both sides pinned to one artifact is
      # what makes the parity guarantee real rather than aspirational.
      - name: TypeScript reproduces every Solidity vector
        run: pnpm vectors

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Default ruleset plus a documented allowlist for vendored code and deliberately-public
          # test fixtures. See .gitleaks.toml — every exclusion carries a written reason.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

      # An independent, allowlist-free check. gitleaks has a documented allowlist; this one has
      # none, so a leak that slips through an allowlist entry still fails the build.
      #
      # It matches a private key rather than a string that NAMES one: a PEM header must be followed
      # by an actual base64 body, and an extended key must carry a full-length payload. Without that
      # distinction, the very test that proves our audit log REJECTS key material would be
      # un-committable, and the usual response to that is to punch a file-shaped hole in the check —
      # which is strictly worse than tightening the pattern.
      - name: No real keys, no mainnet broadcast artifacts
        run: |
          set -euo pipefail

          PEM_RE='(?s)-----BEGIN [A-Z ]*PRIVATE KEY-----[\r\n]+[A-Za-z0-9+/=[:space:]]{64,}'
          XPRV_RE='(xprv|tprv)[0-9a-zA-Z]{80,}'
          EXCLUDES=(--exclude-dir=node_modules --exclude-dir=lib --exclude-dir=.git --exclude-dir=out --exclude-dir=cache)

          # Prove the check still fires before trusting it to pass. A security check that has been
          # accidentally neutered looks exactly like a clean repository.
          canary=$(mktemp -d)
          printf -- '-----BEGIN EC PRIVATE KEY-----\nMHQCAQEEIA%s\nAwEHoUQDQgAE%s\n-----END EC PRIVATE KEY-----\n' \
            "$(head -c 48 /dev/zero | tr '\0' 'A')" "$(head -c 48 /dev/zero | tr '\0' 'B')" > "$canary/key.pem"
          printf "xprv%s\n" "$(head -c 100 /dev/zero | tr '\0' 'z')" > "$canary/ext.txt"
          if ! grep -rIlzP "$PEM_RE" "$canary" >/dev/null; then
            echo "::error::self-test failed — the PEM detector no longer matches a real key"; exit 1
          fi
          if ! grep -rIlE "$XPRV_RE" "$canary" >/dev/null; then
            echo "::error::self-test failed — the extended-key detector no longer matches a real key"; exit 1
          fi
          rm -rf "$canary"
          echo "secret detectors self-test: both fire on synthetic key material"

          if grep -rIlzP "${EXCLUDES[@]}" "$PEM_RE" . ; then
            echo "::error::PEM private key material found in the repository"; exit 1
          fi
          if grep -rInE "${EXCLUDES[@]}" "$XPRV_RE" . ; then
            echo "::error::BIP-32 extended private key found in the repository"; exit 1
          fi

          # Chain 4663 is Robinhood mainnet. Broadcast artifacts for it must never be committed.
          if [ -d contracts/broadcast ] && find contracts/broadcast -path '*/4663/*' -name '*.json' | grep -q . ; then
            echo "::error::mainnet (4663) broadcast artifact committed"; exit 1
          fi

          echo "no key material, no mainnet broadcast artifacts"

  nightly-deep-fuzz:
    name: Deep stateful fuzzing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Long invariant campaign
        working-directory: contracts
        run: FOUNDRY_PROFILE=deep forge test -vv
